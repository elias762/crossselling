<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Automotive AI Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: App-Shell. Feste Seitenleiste mit Logos, Kopfzeile mit KI-Status, Arbeitsbereich mit zwei bis drei scrollenden Bereichen je Modul. Bewusst nur helles Thema: Business-Anwendung, Logos sind für Weiß gestaltet. */
:root{
  color-scheme:light;
  --bg:#f3f4f8; --panel:#ffffff; --panel-2:#f8f9fc; --hover:#f0f3f9; --line:#e1e5ee; --line-2:#cdd3df;
  --ink:#0a1238; --ink-2:#4a5272; --ink-3:#8389a3;
  --brand:#0a1238; --accent:#0a63b0; --accent-2:#0070bb; --accent-soft:#e7f0fa; --accent-ink:#ffffff;
  --ai:#4a3fc4; --ai-soft:#efedfc;
  --ok:#0c8a0c; --ok-soft:#e5f5e5; --warn:#b77800; --warn-dot:#fab219; --warn-soft:#fff4dc;
  --crit:#c23434; --crit-dot:#d03b3b; --crit-soft:#fdeaea;
  --cal-busy:#eceff5; --cal-free:#ffffff;
  --sans:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  --r:8px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.45;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-3)}
.sm{font-size:12px}
.xs{font-size:11px}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side .logo{padding:20px 20px 14px}
.side .logo img{width:150px;height:auto;display:block}
.suite{margin:0 12px 10px;padding:10px 10px;border-radius:var(--r);background:var(--panel-2);border:1px solid var(--line)}
.suite b{display:block;font-size:13px}
.suite span{font-size:11.5px;color:var(--ink-3)}
.nav{display:grid;gap:2px;padding:6px 10px}
.nav .sec{padding:12px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--ink-2);font-weight:500;text-align:left}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav button .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--ink-2)}
.nav button.on .cnt{background:var(--panel);border-color:transparent;color:var(--accent)}
.side-foot{margin-top:auto;padding:14px 16px 18px;border-top:1px solid var(--line);display:grid;gap:10px}
.partner .lbl{display:block;margin-bottom:6px}
.partner img{width:132px;height:auto;display:block}
.env{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}
.env i{width:7px;height:7px;border-radius:50%;background:var(--warn-dot)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;height:54px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.crumb b{color:var(--ink);font-weight:600}
.crumb .sep{color:var(--line-2)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.aitog{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 8px;font-size:12px;background:var(--panel)}
.aitog .sw{width:28px;height:16px;border-radius:999px;background:var(--line-2);position:relative;transition:background .2s}
.aitog .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.aitog.on .sw{background:var(--ai)}
.aitog.on .sw::after{transform:translateX(12px)}
.aitog[disabled]{opacity:.6;cursor:default}
.iconbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12px;background:var(--panel);color:var(--ink-2)}
.iconbtn:hover{border-color:var(--line-2);color:var(--ink)}
.iconbtn .cnt{font-family:var(--mono);font-size:11px;color:var(--accent)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.view{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 20px 18px;gap:12px;overflow:hidden}

/* Module chrome */
.mhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.mhead h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.mhead p{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.mhead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.kpi .v{font-size:21px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;transition:color .4s}
.kpi .l{font-size:11.5px;color:var(--ink-3)}
.kpi .d{font-size:11px;font-family:var(--mono);margin-left:6px}
.kpi.flash .v{color:var(--accent)}
.ws{flex:1;min-height:0;display:grid;gap:12px}
.ws3{grid-template-columns:300px minmax(0,1fr) 340px}
.ws2{grid-template-columns:minmax(0,1fr) 400px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0;min-height:0;display:flex;flex-direction:column}
.pane>.ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.pane>.ph h2{font-size:13px;font-weight:600}
.pane>.ph .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.pane>.pb{padding:14px;overflow:auto;flex:1;min-height:0}
.pane>.pb.flush{padding:0}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:7px;padding:7px 13px;font-weight:600;font-size:12.5px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ai{background:var(--ai);border-color:var(--ai)}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--hover);filter:none}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{padding:5px 11px;font-size:12px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:#fff}
.inp,select.inp,textarea.inp{border:1px solid var(--line-2);border-radius:7px;padding:6px 10px;background:var(--panel);font-size:12.5px;min-width:0}
textarea.inp{width:100%;resize:vertical;line-height:1.5;font-size:13px;padding:10px 12px}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);display:inline-block}
.pill.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}.pill.ok i{background:var(--ok)}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}.pill.warn i{background:var(--warn-dot)}
.pill.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}.pill.crit i{background:var(--crit-dot)}
.pill.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}.pill.acc i{background:var(--accent)}
.pill.ai{background:var(--ai-soft);border-color:transparent;color:var(--ai)}.pill.ai i{background:var(--ai)}

/* Lists */
.filters{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.filters button{font-size:11.5px;padding:3px 9px;border-radius:999px;color:var(--ink-2);border:1px solid transparent}
.filters button.on{border-color:var(--line-2);background:var(--panel-2);color:var(--ink);font-weight:500}
.msg{display:grid;gap:3px;padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%;position:relative}
.msg:hover{background:var(--hover)}
.msg.on{background:var(--accent-soft)}
.msg.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.msg .r1{display:flex;gap:8px;align-items:baseline}
.msg .r1 b{font-weight:600;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .r1 span{margin-left:auto;font-size:11px;color:var(--ink-3);white-space:nowrap;font-family:var(--mono)}
.msg .sub{font-size:12.5px;font-weight:500}
.msg .pre{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .r3{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.msg.unread .r1 b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}

/* Detail blocks */
.mailhd{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.mailhd .av{width:36px;height:36px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--ink-2);flex:none}
.mailhd h3{font-size:15px;font-weight:600}
.mailbody{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:13.5px;line-height:1.6;white-space:pre-line}
.block{margin-top:16px}
.block>.bh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.block>.bh .r{margin-left:auto}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts>div{background:var(--panel);padding:8px 11px;min-width:0}
.facts dt{font-size:11px;color:var(--ink-3)}
.facts dd{margin:2px 0 0;font-weight:500;font-size:13px;overflow-wrap:anywhere}
.ai-card{border:1px solid color-mix(in srgb,var(--ai) 28%,var(--line));border-radius:var(--r);background:linear-gradient(180deg,var(--ai-soft),var(--panel) 70px)}
.ai-card>.ah{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid color-mix(in srgb,var(--ai) 15%,var(--line));flex-wrap:wrap}
.ai-card>.ah b{color:var(--ai);display:flex;align-items:center;gap:6px}
.ai-card>.ah .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.ai-card>.ab{padding:12px 14px;display:grid;gap:12px}
.callout{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border-radius:7px;padding:9px 12px;font-size:12.5px}
.callout svg{color:var(--warn);margin-top:1px}
.vorg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.vorg>div{border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:var(--panel)}
.vorg .t{display:flex;gap:6px;align-items:center;margin-bottom:3px}
.vorg b{font-size:13px}
.vorg p{font-size:12px;color:var(--ink-2)}
.checks{display:grid;gap:4px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:12.5px}
.checks input{margin-top:2px;accent-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);border-radius:7px;padding:5px 10px;font-size:12px;font-family:var(--mono);background:var(--panel)}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent);background:var(--accent);color:#fff}
.actbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:4px}
.done{display:flex;gap:10px;align-items:flex-start;background:var(--ok-soft);border-radius:var(--r);padding:12px 14px;font-size:12.5px}
.done svg{color:var(--ok);margin-top:1px}
.done b{display:block;font-size:13px;margin-bottom:2px}
.steps{display:grid;gap:6px;padding:4px 0}
.steps div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.steps div.go{color:var(--ink)}
.steps div.ok{color:var(--ink-2)}
.steps .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.steps div.go .dot{border-color:var(--ai);border-right-color:transparent;animation:spin .7s linear infinite}
.steps div.ok .dot{border-color:var(--ok);background:var(--ok);box-shadow:inset 0 0 0 2px #fff}
@keyframes spin{to{transform:rotate(360deg)}}
.src{font-size:11px;color:var(--ink-3)}
.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:30px 16px;color:var(--ink-3);font-size:12.5px}
.empty svg{width:28px;height:28px;color:var(--line-2)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Calendar */
.cal{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));gap:3px;font-size:11px}
.cal .h{text-align:center;font-weight:600;color:var(--ink-2);padding:2px 0 4px;line-height:1.2}
.cal .h span{display:block;font-weight:400;color:var(--ink-3);font-family:var(--mono);font-size:10px}
.cal .t{font-family:var(--mono);color:var(--ink-3);font-size:10px;padding-top:6px}
.cal .c{min-height:34px;border-radius:5px;padding:3px 5px;line-height:1.2;overflow:hidden;font-size:10.5px}
.cal .c.busy{background:var(--cal-busy);color:var(--ink-3)}
.cal .c.free{background:var(--cal-free);border:1px dashed var(--line-2)}
.cal .c.free:hover{border-color:var(--accent)}
.cal .c.sug{border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.cal .c.sel{background:var(--accent);color:#fff;border:1.5px solid var(--accent)}
.cal .c.new{background:var(--ok-soft);color:var(--ok);font-weight:500}
.capbar{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));gap:3px;margin-top:6px}
.capbar div{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.capbar div i{display:block;height:100%;background:var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hist{display:grid;gap:0}
.hist div{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
.hist div:last-child{border-bottom:0}
.hist span{font-family:var(--mono);color:var(--ink-3);font-size:11px}

/* Tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.tbl th{position:sticky;top:0;background:var(--panel);z-index:1;text-align:left;font-weight:500;font-size:11px;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.tbl th.s{cursor:pointer}
.tbl th.s:hover{color:var(--ink)}
.tbl th.on{color:var(--accent)}
.tbl th.rt,.tbl td.rt{text-align:right}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl tbody tr.on td{background:var(--accent-soft)}
.tbl tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.tbl td b{font-weight:600}
.tbl td small{display:block;color:var(--ink-3);font-size:11px}
.tbl .bar{display:inline-block;height:6px;border-radius:3px;background:var(--line);width:56px;vertical-align:middle;margin-right:6px;overflow:hidden}
.tbl .bar i{display:block;height:100%;border-radius:3px}
.delta-up{color:var(--ok)}.delta-dn{color:var(--crit)}
.flag{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:700;margin-left:4px}

/* Charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--ink-3)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-2);stroke-width:1}
.chart .s1{stroke:var(--accent);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .s2{stroke:var(--ink-3);stroke-width:2;fill:none;stroke-dasharray:0;opacity:.55;stroke-linejoin:round}
.chart .a1{fill:var(--accent);opacity:.08}
.chart .dot1{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.chart .xh{stroke:var(--ink-3);stroke-width:1;opacity:0}
.chart .hit{fill:transparent}
.chart .vl{fill:var(--ink);font-family:var(--mono);font-size:11px}
.chart-wrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:6px;padding:6px 9px;font-size:11.5px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s;z-index:3}
.tip b{font-family:var(--mono);font-weight:500}
.spark{width:84px;height:24px;display:block}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:1.5}
.spark circle{fill:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;flex:none}
.tabs button{padding:10px 10px 9px;font-size:12.5px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.rules{display:grid;gap:6px}
.rules>div{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:8px 10px;border-radius:7px;background:var(--warn-soft)}
.rules>div.okr{background:var(--ok-soft)}
.rules>div svg{margin-top:2px;color:var(--warn)}
.rules>div.okr svg{color:var(--ok)}
.lbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.rules code{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:12.5px}
.hyp{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-right:6px;vertical-align:1px}
.strip{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;font-size:12px;color:var(--ink-2)}
.strip b{color:var(--ink);font-family:var(--mono);font-weight:500}

/* Chat */
.chat{display:flex;flex-direction:column;min-height:0;flex:1}
.chat .log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.bub{max-width:92%;padding:9px 12px;border-radius:10px;font-size:12.5px;line-height:1.55;white-space:pre-line}
.bub.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:3px}
.bub.a{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:3px}
.bub .src{display:block;margin-top:6px}
.chat .sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.chat .sugg button{font-size:11.5px;border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;text-align:left;background:var(--panel)}
.chat .sugg button:hover{border-color:var(--ai);color:var(--ai)}
.chat form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.chat form input{flex:1}

/* Price range */
.range{position:relative;height:46px;margin:6px 6px 0}
.range .track{position:absolute;top:20px;left:0;right:0;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ok-soft),var(--warn-soft) 70%,var(--crit-soft))}
.range .mk{position:absolute;top:12px;width:2px;height:22px;background:var(--ink-3);transform:translateX(-1px)}
.range .mk span{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--ink-3);white-space:nowrap;font-family:var(--mono)}
.range .pt{position:absolute;top:16px;width:14px;height:14px;border-radius:50%;transform:translateX(-7px);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line-2)}
.range .pt span{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:10.5px;white-space:nowrap;font-weight:600}
.range .pt.cur{background:var(--ink)}
.range .pt.sug{background:var(--ai)}
.range .pt.sug span{color:var(--ai)}
.trace{display:grid;gap:0;counter-reset:t}
.trace div{display:grid;grid-template-columns:20px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px;align-items:baseline}
.trace div::before{counter-increment:t;content:counter(t);font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.trace div:last-child{border-bottom:0}
.trace em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.propose{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.propose .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.propose .v.ai{color:var(--ai)}
.weeks{display:flex;gap:4px;align-items:flex-end;height:44px}
.weeks div{flex:1;background:var(--accent);opacity:.75;border-radius:3px 3px 0 0;min-height:2px}
.weeks div.last{opacity:1}

/* Score */
.score{display:grid;gap:7px}
.score>div{display:grid;grid-template-columns:minmax(0,190px) 1fr 34px;gap:10px;align-items:center;font-size:12px}
.score .b{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.score .b i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .6s ease}
.score .p{font-family:var(--mono);text-align:right}
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig b{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.match{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.match:last-child{border-bottom:0}
.match small{color:var(--ink-3);font-size:11px;grid-column:1/-1}

/* Kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px;overflow:auto;flex:1;min-height:0}
.kcol{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0}
.kcol h3{font-size:12.5px;font-weight:600;padding:10px 12px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line)}
.kcol h3 span{margin-left:auto;font-family:var(--mono);font-weight:400;color:var(--ink-3);font-size:11px}
.kcol .kb{padding:8px;display:grid;gap:8px;align-content:start;overflow:auto}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 11px;display:grid;gap:4px;font-size:12px}
.kcard b{font-size:12.5px}
.kcard.new{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
.kcard .r{display:flex;gap:6px;align-items:center;justify-content:space-between;color:var(--ink-3);font-size:11px}

/* Drawer, modal, toast */
.scrim{position:fixed;inset:0;background:rgba(10,18,56,.32);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);z-index:21;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(10,18,56,.15);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h2{font-size:14px}
.drawer .dh button{margin-left:auto}
.drawer .db{overflow:auto;flex:1;padding:6px 16px 16px}
.logi{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.logi span{font-family:var(--mono);color:var(--ink-3);font-size:11px}
.logi .m{display:flex;gap:6px;align-items:center;margin-bottom:3px;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:21;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--panel);border-radius:12px;width:min(680px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(10,18,56,.25)}
.modal .box.wide{width:min(980px,100%)}
.modal .mh{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h2{font-size:15px}
.modal .mh button{margin-left:auto}
.modal .mb{padding:16px 18px;overflow:auto;display:grid;gap:12px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:12.5px;opacity:0;transition:all .25s;z-index:30;pointer-events:none;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.x{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3)}
.x:hover{background:var(--hover);color:var(--ink)}


.ws{grid-template-rows:minmax(0,1fr)}
.strip button{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12px}
.strip button:hover{color:var(--accent)}
.strip button svg{color:var(--ok)}
.cal button.c{text-align:left;font-size:10.5px;cursor:pointer}
.cal button.c:disabled{cursor:default}
.chip:disabled{opacity:.6;cursor:default}

/* Responsive */
@media (max-width:1280px){
  .ws3{grid-template-columns:280px minmax(0,1fr)}
  .ws3>.pane:nth-child(3){grid-column:1/-1}
  .view{overflow:auto}
  .ws{flex:none;grid-template-rows:none}
  .ws3>.pane:nth-child(1),.ws3>.pane:nth-child(2){max-height:780px}
  .ws2>.pane{max-height:820px}
}
@media (max-width:1100px){
  .ws2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  html,body{height:auto}
  .shell{grid-template-columns:minmax(0,1fr);height:auto}
  .side{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
  .side .logo{padding:12px 16px}
  .side .logo img{width:120px}
  .suite{display:none}
  .nav{display:flex;overflow-x:auto;width:100%;padding:0 10px 8px;gap:4px}
  .nav .sec{display:none}
  .nav button{white-space:nowrap;flex:none}
  .side-foot{display:flex;align-items:center;margin:0 0 0 auto;border-top:0;padding:10px 16px}
  .side-foot .env{display:none}
  .partner .lbl{display:none}
  .partner img{width:92px}
  .main{min-height:0}
  .top{padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));height:auto;min-height:50px;flex-wrap:wrap;padding-block:8px}
  .view{padding:12px max(12px,env(safe-area-inset-right,0px)) 16px max(12px,env(safe-area-inset-left,0px));overflow:visible}
  .ws3{grid-template-columns:minmax(0,1fr)}
  .ws3>.pane:nth-child(1){max-height:360px}
  .ws3>.pane:nth-child(2),.ws2>.pane{max-height:none}
  .ws3>.pane>.pb,.ws2>.pane>.pb{overflow:visible}
  .ws3>.pane:nth-child(1)>.pb{overflow:auto}
  .ws2>.pane>.pb.tblwrap{overflow:auto;max-height:460px}
}
@media (max-width:520px){
  .crumb .hide-s{display:none}
  .aitog .t{display:none}
  .score>div{grid-template-columns:minmax(0,1fr) 70px 30px}
  .propose{grid-template-columns:1fr}
  .propose>svg{transform:rotate(90deg);justify-self:center}
  .kpi .v{font-size:18px}
}

function cpStats(){
  const base=D.SITES.map(s=>{
    const revM=CP.div?s.revDiv.map(m=>m[CP.div-1]):s.rev;
    const rev=sum(revM.slice(3)), plan=s.plan*(CP.div?s.sh[CP.div-1]:1);
    const cars=D.CARS.filter(c=>c.site===s.id);
    return {s,revM,rev,plan,vsPlan:(rev/plan-1)*100,mg3:avg(s.margin.slice(9)),ut:s.ut[11],utD:s.ut[11]-s.ut[10],standz:avg(cars.map(c=>c.days)),nCars:cars.length,capital:sum(cars.map(c=>c.ek)),conv:s.conv,cancel:s.cancel[11]};
  });
  const tr=sum(base.map(b=>sum(b.s.rev.slice(9))));
  const gMg=sum(base.map(b=>sum(b.s.rev.slice(9))*b.mg3))/tr;
  base.forEach(b=>{
    const f=[];
    if(b.utD<=-8)f.push({k:'ut',t:`Werkstattauslastung ${sgn(b.utD,0)} Prozentpunkte gegenüber Vormonat (Sep 26: ${b.ut} %)`,rule:'Δ Auslastung ≤ −8 pp'});
    if(b.mg3<gMg-1.5)f.push({k:'mg',t:`Operative Marge Jul–Sep ${pct(b.mg3)} gegenüber Gruppe ${pct(gMg)}`,rule:'Marge 3 Mon. < Gruppe − 1,5 pp'});
    if(b.standz>80)f.push({k:'gw',t:`Ø Standzeit Gebrauchtwagen ${de(b.standz)} Tage bei ${b.nCars} Fahrzeugen`,rule:'Ø GW-Standzeit > 80 Tage'});
    if(b.vsPlan<-5)f.push({k:'plan',t:`Umsatz ${sgn(b.vsPlan)} % unter Plan`,rule:'Umsatz < Plan − 5 %'});
    b.flags=f;
  });
  return {rows:base,gMg,tr};
}
function spark(vals){

function normLD(v){

  return {kaufinteresse:String(v.kaufinteresse||'Mittel'),konkretheit:Math.max(0,Math.min(100,parseInt(v.konkretheit,10)||50)),wunsch:String(v.fahrzeugwunsch),such:String(v.suchbegriff||''),inzahlung:String(v.inzahlungnahme||'Nicht erwähnt'),finanz:String(v.finanzierung||'Nicht erwähnt'),fehlend:strArr(v.fehlend,3),empf:String(v.empfehlung||''),antwort:String(v.antwort||''),src:'live'};
}
function ruleLD(l){
  const t=l.text.toLowerCase(),models=['X3','X1','320d','118i','Tiguan','Golf','ID.4','Passat','C 200','A 180','GLC','A4 Avant','A3','Q3','Q5','Octavia','Kodiaq','Enyaq'];
  const m=models.find(x=>t.includes(x.toLowerCase()));const has=(...w)=>w.some(x=>t.includes(x));
  const k=(m?40:10)+(has('probefahrt','termin','kaufen','angebot')?25:0)+(has('finanz','leasing')?10:0)+(has('zahlung')?10:0);
  return {kaufinteresse:k>=60?'Konkret':k>=35?'Mittel':'Unverbindlich',konkretheit:Math.min(95,k),wunsch:m||'Nicht eindeutig',such:m||'',inzahlung:has('zahlung')?'Ja':'Nicht erwähnt',finanz:has('finanz')?'Angefragt':has('leasing')?'Leasing angefragt':'Nicht erwähnt',fehlend:['Telefonnummer'],empf:'Schlüsselwortbasierte Einstufung, da Live-KI nicht aktiv ist. Rückruf anbieten.',

}
async function ldRun(id,quiet){

  LD.an[id]=res;l.status='qualifiziert';LD.slot[id]=D.LEAD_SLOTS[0];if(!quiet)LD.busy=null;

  render();
}

  'ld-sel':a=>{LD.sel=a.dataset.id;const l=LD.leads.find(x=>x.id===LD.sel);l.unread=false;render();const p=$('[data-keep="ld-detail"]');if(p)p.scrollTop=0;},
  'ld-open':a=>{LD.sel=a.dataset.id;LD.view='inbox';render();},
  'ld-run':a=>ldRun(a.dataset.id),'ld-redo':a=>{delete LD.an[a.dataset.id];ldRun(a.dataset.id);},'ld-batch':()=>ldBatch(),
  'ld-slot':a=>{LD.slot[LD.sel]=a.dataset.s;render();},
  'ld-ok':a=>ldApprove(a.dataset.id),'ld-new':()=>ldNewModal(),
  'nl-ex':a=>{const e=ldNewModal.ex[+a.dataset.i];$('#nl-text').value=e[2];$('#nl-from').value=e[1];},
  'ld-create':()=>{const t=$('#nl-text').value.trim();if(t.length<5){toast('Bitte einen Anfragetext eingeben');return;}const id='l'+(LD.leads.length+1)+'x'+Date.now()%1000;
    LD.leads.unshift({id,from:$('#nl-from').value.trim()||'Unbekannt',src:$('#nl-src').value,time:nowT(),subject:t.replace(/\s+/g,' ').slice(0,40)+(t.length>40?' …':''),status:'neu',unread:false,prior:0,text:t});
    LD.sel=id;LD.view='inbox';closeOverlay();ldRun(id);}
};
document.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('modal')){closeOverlay();return;}const a=e.target.closest('[data-act]');if(!a||a.disabled)return;const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a,e);}});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
  if(k==='as-draft'){AS.draft[el.dataset.id]=el.value;if(!AS.edited[el.dataset.id]){AS.edited[el.dataset.id]=true;}}
  else if(k==='ld-draft'){LD.draft[el.dataset.id]=el.value;LD.edited[el.dataset.id]=true;}
  else if(k==='gw-q'){GW.q=el.value;render();}
});
document.addEventListener('change',e=>{const el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
  if(k==='gw-site'){GW.site=el.value;render();}else if(k==='ld-seller'){LD.seller[el.dataset.id]=el.value;}
});
document.addEventListener('submit',e=>{if(e.target.id==='cp-form'){e.preventDefault();const i=$('#cp-in');const q=i.value;i.value='';cpAsk(q,null);}});
